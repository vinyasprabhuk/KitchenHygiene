---
deployment:
  tasks:
    # Repository path IS the live app folder (Setup Python App's
    # Application root), so no file-copy step is needed. Everything lives
    # in deploy.sh (single script, uses the venv's absolute python/pip
    # paths throughout, echoes progress) so a partial failure shows
    # exactly where it stopped instead of failing silently mid-deploy.
    - bash deploy.sh
